name: Construir POU PROTECT Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps
    
      - name: Instalar Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Crear configuración de Capacitor
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.pouprotect.app',
            appName: 'POU PROTECT',
            webDir: 'dist'
          };

          export default config;
          EOF

      - name: Construir página web
        run: npm run build

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Construir APK
        run: cd android && ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: POU-PROTECT-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
